<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
    integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Results summary component</title>

</head>

<body>

  <div class="wrapper">
    <div class="result">
      <h2 class="result__header">Your Result</h2>
      <div class="result__circle">
        <div class="result__score">76</div>
        <div class="result__text">of 100</div>
      </div>
      <h3 class="result__evaluate">Great</h3>
      <p class="result__comment">You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    <div class="summary">
      <h2 class="summary__header">Summary</h2>
      <div class="summary__parameter">
        <div class="parameter-frame reaction">
          <div class="name-score">
            <i class="fa-solid fa-bolt"></i>
            <div class="name-param">Reaction</div>
          </div>
          <div class="score-param"><span class="score">80</span>  <span class="max-score"> / 100</span></div>
        </div>
        <div class="parameter-frame memory">
          <div class="name-score">
            <i class="fa-solid fa-brain"></i>
            <div class="name-param">Memory</div>
          </div>
          <div class="score-param"><span class="score">92</span>  <span class="max-score"> / 100</span></div>
        </div>
        <div class="parameter-frame verbal">
          <div class="name-score">
            <i class="fa-solid fa-comments"></i>
            <div class="name-param">Verbal</div>
          </div>
          <div class="score-param"><span class="score">61</span>  <span class="max-score"> / 100</span></div>
        </div>
        <div class="parameter-frame visual">
          <div class="name-score">
            <i class="fa-solid fa-eye"></i>
            <div class="name-param">Visual</div>
          </div>
          <div class="score-param"><span class="score">73</span>  <span class="max-score"> / 100</span></div>
        </div>
      </div>
      <button class="btn">Continue</button>
    </div>
  </div>

  <script src="https://kit.fontawesome.com/f4d6fade13.js" crossorigin="anonymous"></script>

</body>



</html>
